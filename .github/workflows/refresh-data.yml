name: Build & Publish Dist

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Every 6 hours: V1 trackers need it, and re-checking known V2 sources is cheap (an unchanged
    # document makes no model call). V2 discovery runs at most once a day per topic (scripts/v2/discovery/cadence.ts).
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: publish-dist
  cancel-in-progress: true

jobs:
  pr-check:
    name: PR check (build only)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # No Chromium download here: package.json has no postinstall hook and this job only builds and tests.
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    name: Build site + publish dist (push/schedule/manual)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Restore the browser cache before anything that could download Chromium,
      # so the install step below is a no-op on a cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm ci

      # The only place Chromium is installed (package.json has no postinstall hook).
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Seed public/data/_lkg from the previous publish so a provider that fails today
      # falls back to its most recent success instead of the snapshot committed in git.
      - name: Restore LKG vault from last publish
        continue-on-error: true
        run: bash .github/scripts/restore-lkg.sh

      # V2 trackers read/write knowledge/games/<game>.json. Check the `knowledge` branch out
      # as a git worktree at ./knowledge (gitignored on main); bootstraps the branch on first run.
      - name: Check out knowledge branch
        continue-on-error: true
        run: bash .github/scripts/knowledge-checkout.sh

      # This runs: build (tsc) + refresh:data + export:site => dist/
      # Evidence-based trackers (League of Legends) use Gemini through the secret below; without it
      # they fail cleanly and serve stored knowledge. Web search is best effort and key-free.
      - name: Build site (includes refresh)
        env:
          AI_PROVIDER: gemini
          AI_MODEL: gemini-3.5-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_PROVIDER: duckduckgo
          # Daily AI safety ceilings (estimated USD and calls per UTC day; usage is tracked in
          # knowledge/usage/ai). Ceilings, not targets: when one is reached AI work is deferred.
          AI_DAILY_COST_LIMIT_USD: "2.00"
          AI_DAILY_CALL_LIMIT: "100"
          AI_PER_TOPIC_CALL_LIMIT: "5"
        run: npm run build:site

      # Commit and push knowledge changes (fast-forward only, never force) and detach the
      # worktree. Must run before the publish step, which wipes the working tree.
      - name: Persist knowledge branch
        continue-on-error: true
        run: bash .github/scripts/knowledge-persist.sh

      # Failed browser fetches write screenshots/HTML to build/debug (never under public/).
      # Must run before the publish step, which wipes the working tree.
      - name: Upload Playwright debug captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish dist/ to gh-pages
        run: |
          set -e
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # copy dist aside
          rm -rf /tmp/dist
          cp -R dist /tmp/dist

          # create orphan gh-pages
          git checkout --orphan gh-pages
          git reset --hard
          rm -rf *

          # move dist to repo root
          cp -R /tmp/dist/* .
          touch .nojekyll

          git add -A
          git commit -m "chore(site): publish dist" || echo "No changes to commit"
          git push -f origin gh-pages
