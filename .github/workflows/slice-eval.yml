name: Vertical slice evaluation

# Runs one V2 topic end to end against the live network and the live model,
# twice: with its configured page, and with that page removed so discovery has
# to find it. Uploads the views, adapter reports and knowledge as an artifact.
# Never writes the production knowledge branch (a throwaway store under build/).
#
# It costs a few live model calls (about 4 per run), so it never runs by itself:
# manual dispatch only, with "confirm_paid_run" ticked. No pull_request, push or
# schedule trigger: opening a pull request that touched discovery, the budget or
# the provider used to start it. The deterministic slice tests run in `npm test`.
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game id (only topics that use AI)
        type: choice
        options:
          - lol
        default: lol
      type:
        description: Topic type
        type: choice
        options:
          - next-patch
        default: next-patch
      confirm_paid_run:
        description: This run makes about 4 billed Gemini calls. Tick to confirm.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Never cancel a running slice: its calls are already billed.
concurrency:
  group: slice-eval
  cancel-in-progress: false

jobs:
  slice:
    name: Slice (live)
    if: ${{ inputs.confirm_paid_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inputs reach the shell as environment variables, never interpolated into the script.
    env:
      SLICE_GAME: ${{ inputs.game }}
      SLICE_TYPE: ${{ inputs.type }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build

      - name: Check the topic is one that uses AI
        run: |
          case "$SLICE_GAME/$SLICE_TYPE" in
            lol/next-patch) ;;
            *) echo "::error::$SLICE_GAME/$SLICE_TYPE is not an approved slice topic"; exit 1 ;;
          esac

      - name: Run with the configured page (first run, then an unchanged second run)
        env:
          AI_PROVIDER: gemini
          AI_MODEL: gemini-3.5-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_PROVIDER: duckduckgo
        run: |
          node build/v2/tools/run-slice.js "$SLICE_GAME" "$SLICE_TYPE" --knowledge build/slice/with-config --out build/slice/with-config-run1.json
          node build/v2/tools/run-slice.js "$SLICE_GAME" "$SLICE_TYPE" --knowledge build/slice/with-config --out build/slice/with-config-run2.json

      - name: Run without the configured page (discovery must find it)
        env:
          AI_PROVIDER: gemini
          AI_MODEL: gemini-3.5-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_PROVIDER: duckduckgo
        run: node build/v2/tools/run-slice.js "$SLICE_GAME" "$SLICE_TYPE" --knowledge build/slice/discovery --no-config-url --out build/slice/discovery-run1.json

      - name: Compare with the V1 provider output
        continue-on-error: true
        run: node build/v2/tools/compare-v1.js "$SLICE_GAME" "$SLICE_TYPE" build/slice/with-config-run1.json > build/slice/v1-comparison.json && cat build/slice/v1-comparison.json

      - name: Upload slice results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/slice/*.json
          if-no-files-found: ignore
          retention-days: 30
