name: AI extraction gold evaluation

# Runs the gold cases in scripts/v2/__tests__/gold against the live model and
# uploads the report. It costs real model calls (about 23 per run, billed to the
# GEMINI_API_KEY account), so it never runs by itself:
#
# - Manual dispatch only. No pull_request, push or schedule trigger: opening or
#   reopening a pull request used to start it, which billed calls nobody asked for.
# - The dispatch must tick "confirm_paid_run"; without it the job is skipped.
# - The model is a fixed list of models with a price entry in
#   scripts/v2/cost/pricing.ts, checked again before the run.
#
# The mock evaluation (no network, no key) is part of `npm test` and runs on
# every pull request; this workflow is only for a deliberate live check.
# The report contains facts, quotes and token counts, never prompts or the key.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate (only models with a price entry)
        type: choice
        options:
          - gemini-3.5-flash
        default: gemini-3.5-flash
      confirm_paid_run:
        description: This run makes about 23 billed Gemini calls. Tick to confirm.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Never cancel a running evaluation: its calls are already billed, and cancelling
# only throws the report away. A second dispatch waits for the first.
concurrency:
  group: ai-eval
  cancel-in-progress: false

jobs:
  evaluate:
    name: Gold evaluation (live)
    if: ${{ inputs.confirm_paid_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      # The dispatch form restricts the choice, but the API accepts any string for a
      # choice input on some clients; refuse a model the cost table cannot price.
      - name: Check the model is an approved, priced model
        env:
          AI_MODEL: ${{ inputs.model }}
        run: node build/v2/ai/eval-guard.js

      - name: Run gold evaluation against the live model
        env:
          AI_PROVIDER: gemini
          AI_MODEL: ${{ inputs.model }}
          AI_LIVE_EVAL_CONFIRMED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node build/v2/ai/eval.js --live

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ai-eval/
          if-no-files-found: ignore
          retention-days: 30
